# Automatically refresh stock prices every weekday evening (after NSE closes)
# and commit the new snapshot. Streamlit Cloud redeploys the dashboard on every push.
name: Refresh price data

on:
  schedule:
    - cron: "30 13 * * 1-5"      # 13:30 UTC = 19:00 IST, Monday–Friday
  workflow_dispatch:              # adds a "Run workflow" button on GitHub for manual runs

permissions:
  contents: write                 # allow the workflow to push the updated data file

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance duckdb pandas

      - name: Download latest prices
        run: python src/fetch_prices.py

      - name: Commit updated snapshot (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/prices.parquet
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Automated price refresh $(date -u +%Y-%m-%d)"
            git push
          fi
